name: Tool pages isolation

on:
  push:
    branches:
      - audit/isolate-pages-tools
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tool page isolation and local assets
        run: node tools/check-tools-isolation.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets/js/tools -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
