name: Sync site ratings

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and calculate ratings
        id: sync
        run: python scripts/sync_ratings.py

      - name: Commit and push changed ratings
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/site-rating.json
          if git diff --cached --quiet; then
            echo "No staged rating changes to commit."
            exit 0
          fi
          git commit -m "chore: sync site ratings"
          git push origin HEAD:main
