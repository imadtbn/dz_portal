                                <option value="wifi">شبكة واي فاي (Wi-Fi)</option>
                            </select>
                        </div>

                            <div class="form-group">
                                <label>النص أو الرابط</label>
                                <textarea id="qr-text" rows="4"
                                    style="width: 100%; padding: 10px; font-family: inherit; border-radius: var(--border-radius); border: 1px solid var(--border-color);"
                                    placeholder="https://example.com" required></textarea>
                            </div>
                        </div>

                        <div id="wifi-input-group" class="hidden">
                            <div class="form-group">
                                <label>اسم الشبكة (SSID)</label>
                                <input type="text" id="wifi-ssid">
                            </div>
                            <div class="form-group">
                                <label>كلمة المرور</label>
                                <input type="password" id="wifi-pass">
                            </div>
                            <div class="form-group">
                                <label>نوع التشفير</label>
                                <select id="wifi-type">
                                    <option value="WPA">WPA/WPA2</option>
                                    <option value="WEP">WEP</option>
                                    <option value="nopass">بدون كلمة مرور</option>
                                </select>

                    style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-color); padding: 20px; border-radius: var(--border-radius); min-height: 250px;">
                    <div id="qrcode"
                        style="margin-bottom: 20px; background: white; padding: 10px; display: inline-block;"></div>
                    <button id="download-btn" class="btn btn-secondary hidden">تحميل الصورة</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const qrType = document.getElementById('qr-type');
        const textGroup = document.getElementById('text-input-group');
        const wifiGroup = document.getElementById('wifi-input-group');
        const qrContainer = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('download-btn');
        let qrCodeObj = null;

        qrType.addEventListener('change', (e) => {
            if (e.target.value === 'text') {
                textGroup.classList.remove('hidden');
                wifiGroup.classList.add('hidden');
                document.getElementById('qr-text').required = true;
            } else {
                textGroup.classList.add('hidden');
                wifiGroup.classList.remove('hidden');
                document.getElementById('qr-text').required = false;
            }
        });

        document.getElementById('qr-form').addEventListener('submit', function (e) {
            e.preventDefault();
            qrContainer.innerHTML = ''; // Clear previous

            let data = '';
            if (qrType.value === 'text') {
                data = document.getElementById('qr-text').value;
            } else {
                const ssid = document.getElementById('wifi-ssid').value;
                const pass = document.getElementById('wifi-pass').value;
                const type = document.getElementById('wifi-type').value;
                // Format: WIFI:T:WPA;S:mynetwork;P:mypass;;
                data = `WIFI:T:${type};S:${ssid};P:${pass};;`;
            }

            if (!data) return;

            qrCodeObj = new QRCode(qrContainer, {
                text: data,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            downloadBtn.classList.remove('hidden');
        });

        downloadBtn.addEventListener('click', () => {
            const img = qrContainer.querySelector('img');
            if (img && img.src) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = img.src;
                link.click();
            } else {
                // If it rendered as canvas instead of img
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'qrcode.png';
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                }
            }
        });
    </script>
