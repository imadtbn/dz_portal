<div class="ad-container dz-import-ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5656416032906373" data-ad-slot="3143411927" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
    <main class="container">
        <div class="tool-container">


            <section class="page-intro" aria-labelledby="Tools-title">
                <div class="page-intro-icon" aria-hidden="true"><i class="fa-solid fa-font"></i></div>
                <h1 id="Tools-title"> أدوات النصوص والبحوث</h1>
                <p>أدوات مفيدة لتحليل وتعديل النصوص والبحوث.</p>
            </section>

            <textarea id="textInput" rows="8" placeholder="اكتب أو انسخ النص هنا..."></textarea>

            <div class="stats-grid">
                <div class="stat-box">
                    <div style="color:var(--text-muted); font-size:0.9em;">الكلمات</div>
                    <div class="stat-value" id="wordCount">0</div>
                </div>
                <div class="stat-box">
                    <div style="color:var(--text-muted); font-size:0.9em;">الأحرف (مع المسافات)</div>
                    <div class="stat-value" id="charCount">0</div>
                </div>
                <div class="stat-box">
                    <div style="color:var(--text-muted); font-size:0.9em;">الأحرف (بدون مسافات)</div>
                    <div class="stat-value" id="charNoSpaceCount">0</div>
                </div>
            </div>

            <div class="actions-grid">
                <button class="btn btn-outline" id="btnRemoveSpaces"><i class="fa-solid fa-compress"></i> إزالة المسافات
                    الزائدة</button>
                <button class="btn btn-outline" id="btnCopy"><i class="fa-solid fa-copy"></i> نسخ النص</button>
                <button class="btn btn-outline" id="btnClear"
                    style="grid-column: 1/-1; border-color: var(--secondary-color); color: var(--secondary-color);"><i
                        class="fa-solid fa-trash"></i> مسح الكل</button>
            </div>
        </div>
    </main>

    <script defer src="/dz_portal/assets/js/tools/theme.js"></script>
    
    <script>
        const textInput = document.getElementById('textInput');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const charNoSpaceCount = document.getElementById('charNoSpaceCount');

        function updateStats() {
            const text = textInput.value;
            charCount.textContent = text.length;
            charNoSpaceCount.textContent = text.replace(/\s/g, '').length;

            const words = text.trim().split(/\s+/);
            wordCount.textContent = text.trim() === '' ? 0 : words.length;
        }

        textInput.addEventListener('input', updateStats);

        document.getElementById('btnRemoveSpaces').addEventListener('click', () => {
            textInput.value = textInput.value.replace(/\s+/g, ' ').trim();
            updateStats();
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            textInput.value = '';
            updateStats();
        });

        document.getElementById('btnCopy').addEventListener('click', () => {
            textInput.select();
            document.execCommand('copy');
            alert('تم نسخ النص بنجاح!');
        });
    </script>
