<body>
  </header>

  <div class="ad-container dz-import-ad"><ins class="adsbygoogle" style="display:block"
      data-ad-client="ca-pub-5656416032906373" data-ad-slot="3143411927" data-ad-format="auto"
      data-full-width-responsive="true"></ins></div>

  <main class="container calculator-page">
      <section class="page-intro" aria-labelledby="calculator-title">
        <div class="page-intro-icon" aria-hidden="true"><i class="fa-solid fa-calculator"></i></div>
        <h1 id="calculator-title"> الآلة الحاسبة الذكية</h1>
        <p>احسب المعادلات بسرعة، ثم احفظ العمليات المهمة للرجوع إليها لاحقًا. البيانات المحفوظة تبقى في متصفحك.</p>
        
      </section>

      <div class="calculator-layout">
        <section class="calculator-card" aria-label="الآلة الحاسبة">
          <div class="display" aria-live="polite">
            <div id="calculatorExpression" class="display-expression">0</div>
            <div id="calculatorResult" class="display-result">0</div>
          </div>

          <div class="keypad" aria-label="لوحة الآلة الحاسبة">
            <button class="calc-key utility" type="button" data-action="clear">AC</button>
            <button class="calc-key utility" type="button" data-action="backspace" aria-label="حذف آخر رمز"><i
                class="fa-solid fa-delete-left"></i></button>
            <button class="calc-key operator" type="button" data-value="%">%</button>
            <button class="calc-key operator" type="button" data-value="/">÷</button>
            <button class="calc-key" type="button" data-value="7">7</button>
            <button class="calc-key" type="button" data-value="8">8</button>
            <button class="calc-key" type="button" data-value="9">9</button>
            <button class="calc-key operator" type="button" data-value="*">×</button>
            <button class="calc-key" type="button" data-value="4">4</button>
            <button class="calc-key" type="button" data-value="5">5</button>
            <button class="calc-key" type="button" data-value="6">6</button>
            <button class="calc-key operator" type="button" data-value="-">−</button>
            <button class="calc-key" type="button" data-value="1">1</button>
            <button class="calc-key" type="button" data-value="2">2</button>
            <button class="calc-key" type="button" data-value="3">3</button>
            <button class="calc-key operator" type="button" data-value="+">+</button>
            <button class="calc-key zero" type="button" data-value="0">0</button>
            <button class="calc-key" type="button" data-value=".">.</button>
            <button class="calc-key" type="button" data-value="(">(</button>
            <button class="calc-key" type="button" data-value=")">)</button>
            <button class="calc-key equals" type="button" data-action="calculate">=</button>
          </div>

          <div class="calculator-actions">
            <button class="btn" id="saveCalculationBtn" type="button" disabled><i class="fa-solid fa-bookmark"></i> حفظ
              العملية</button>
            <button class="btn btn-outline" id="cancelEditBtn" type="button" hidden>إلغاء التعديل</button>
          </div>

          <div class="save-panel">
            <div id="editMode" class="edit-mode" hidden><i class="fa-solid fa-pen"></i> وضع تعديل العملية</div>
            <label class="sr-only" for="calculationTitle">اسم العملية</label>
            <div class="save-fields">
              <input id="calculationTitle" type="text" maxlength="80" placeholder="اسم العملية (اختياري)"
                autocomplete="off">
              <button class="btn btn-outline" type="button" id="copyResultBtn"><i class="fa-regular fa-copy"></i> نسخ
                النتيجة</button>
            </div>
          </div>
          <p class="calculator-note">تُحفظ العمليات محليًا في هذا المتصفح ولا تُرسل إلى خادم.</p>
        </section>

        <section class="history-card" aria-labelledby="historyHeading">
          <div class="history-head">
            <div>
              <h2 id="historyHeading"><i class="fa-solid fa-clock-rotate-left"></i> عملياتي المحفوظة</h2>
              <span id="historyCount" class="history-count">0 عملية</span>
            </div>
            <button id="clearHistoryBtn" class="history-btn delete" type="button">حذف الكل</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="feedbackContainer"></div>

  <script defer src="/dz_portal/assets/js/tools/theme.js"></script>
  <script src="/dz_portal/assets/js/student-storage.js"></script>
  <script src="/dz_portal/assets/js/tools/student-calculator.js"></script>
  <script>
    if (typeof StorageApp !== 'undefined' && StorageApp.addRecent) {
      StorageApp.addRecent({ id: 'smart-calculator', title: 'الآلة الحاسبة الذكية', url: 'tools/calculator.html', icon: '🧮' });
    }
    document.getElementById('copyResultBtn').addEventListener('click', async () => {
      const text = document.getElementById('calculatorResult').textContent;
      if (!text || text === '—' || text === '0' || text.includes('خطأ')) return;
      try {
        await navigator.clipboard.writeText(text);
        const button = document.getElementById('copyResultBtn');
        const old = button.innerHTML;
        button.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ';
        setTimeout(() => { button.innerHTML = old; }, 1400);
      } catch { alert('تعذر نسخ النتيجة.'); }
    });
  </script>
