    <style>
        .tool-container {
            max-width: 850px;
            margin: 2rem auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md)
        }

        .row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 40px;
            gap: 10px;
            margin-bottom: 10px
        }

        .row input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family)
        }

        .remove {
            border: 0;
            border-radius: 50%;
            background: #d9534f;
            color: white;
            cursor: pointer
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px
        }

        .result {
            display: none;
            margin-top: 22px;
            padding: 20px;
            text-align: center;
            background: var(--primary-light);
            color: white;
            border-radius: var(--radius-md)
        }

        .result strong {
            font-size: 1.8rem
        }

        .note {
            color: var(--text-muted);
            font-size: .9rem
        }

        @media(max-width:600px) {
            .row {
                grid-template-columns: 1fr 1fr
            }

            .remove {
                grid-column: auto
            }

            .tool-container {
                padding: 1rem
            }

            .actions {
                flex-direction: column
            }
        }
    </style>

<body>
    <div class="ad-container dz-import-ad"><ins class="adsbygoogle" style="display:block"
            data-ad-client="ca-pub-5656416032906373" data-ad-slot="3143411927" data-ad-format="auto"

    <main class="container">
        <div class="tool-container">

            <section class="page-intro" aria-labelledby="Tools-title">
                <div class="page-intro-icon" aria-hidden="true"><i class="fa-solid fa-ranking-star"></i></div>
                <h1 id="Tools-title"> حاسبة الترتيب / النقاط</h1>
                <p>أدخل المادة، العلامة والمعامل لحساب مجموع النقاط والمتوسط الموزون</p>
            </section>

            <div id="rows"></div>
            <div class="actions"><button class="btn btn-outline" id="add"><i class="fa-solid fa-plus"></i> إضافة
                    مادة</button><button class="btn" id="calc"><i class="fa-solid fa-ranking-star"></i> احسب</button>
            </div>
            <div class="result" id="result">
                <div>مجموع النقاط</div><strong id="points">0</strong>
                <p>المتوسط الموزون: <strong id="avg">0</strong> / 20</p>
                <p class="note">الترتيب الفعلي بين الطلبة يحتاج إلى بيانات نتائج المجموعة، لذلك هذه الأداة تحسب نقاطك
                    ومتوسطك ولا تخترع ترتيباً.</p>
            </div>
        </div>
    </main>

    <script defer src="/dz_portal/assets/js/tools/theme.js"></script>
    <script>const rows = document.getElementById('rows'); function addRow() { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<input class="name" placeholder="اسم المادة"><input class="mark" type="number" min="0" max="20" step="0.01" placeholder="العلامة /20"><input class="coef" type="number" min="1" value="1" placeholder="المعامل"><button class="remove">×</button>'; r.querySelector('.remove').onclick = () => { if (rows.children.length > 1) r.remove(); else alert('يجب إبقاء مادة واحدة على الأقل.'); }; rows.appendChild(r) } for (let i = 0; i < 3; i++)addRow(); document.getElementById('add').onclick = addRow; document.getElementById('calc').onclick = () => { let points = 0, total = 0; rows.querySelectorAll('.row').forEach(r => { const m = parseFloat(r.querySelector('.mark').value), c = parseFloat(r.querySelector('.coef').value) || 0; if (!Number.isNaN(m) && c > 0) { points += m * c; total += c } }); if (!total) return alert('أدخل علامات ومعاملات صالحة.'); document.getElementById('points').textContent = points.toFixed(2); document.getElementById('avg').textContent = (points / total).toFixed(2); document.getElementById('result').style.display = 'block' };</script>
